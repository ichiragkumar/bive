<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>herdr — agent fleet</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header id="topbar">
      <span id="conn-dot" class="dot gray" title="daemon connection"></span>
      <h1>herdr</h1>
      <span id="fleet-summary" class="muted">no agents</span>
      <span class="spacer"></span>
      <label for="filter">filter:</label>
      <select id="filter">
        <option value="all">all</option>
        <option value="Working">working</option>
        <option value="Blocked">blocked</option>
        <option value="Idle">idle</option>
        <option value="Errored">errored</option>
      </select>
      <button id="btn-spawn">+ shell</button>
      <button id="btn-kill-all" class="danger">kill all</button>
    </header>

    <main id="fleet" class="cards"></main>

    <dialog id="detail">
      <article>
        <header>
          <h2 id="detail-title">agent</h2>
          <button class="close" id="detail-close">×</button>
        </header>
        <div id="detail-actions">
          <button id="detail-copy">copy id</button>
          <button id="detail-kill" class="danger">kill agent</button>
        </div>
        <section id="detail-media"></section>
        <pre id="detail-log" class="log"></pre>
        <footer>
          <input id="composer" placeholder="send input to agent…" />
          <button id="composer-send">send</button>
        </footer>
      </article>
    </dialog>

    <script src="app.js"></script>
  </body>
</html>
